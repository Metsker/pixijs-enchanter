name: Deploy to GitHub Pages

on:
  push:
    branches: [gems]
  workflow_dispatch:

# Allow only one concurrent deploy; cancel in-progress ones in
# favour of the latest push so we never deploy stale builds.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git rev-list --count HEAD` (vite.config
          # uses it for the visible version badge) returns the real
          # number instead of 1 from a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Type-check
        run: npx svelte-check --tsconfig ./tsconfig.json
      - name: Build
        env:
          GITHUB_PAGES: '1'
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
